<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" fill="none">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c2a4ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#c2a4ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c2a4ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c2a4ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a48ad4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#a48ad4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background glow -->
  <ellipse cx="400" cy="130" rx="380" ry="120" fill="url(#glow)"/>
  <!-- Grid lines -->
  <g stroke="#c2a4ff" stroke-opacity="0.08" stroke-width="1">
    <line x1="100" y1="40" x2="100" y2="220"/>
    <line x1="200" y1="20" x2="200" y2="240"/>
    <line x1="300" y1="40" x2="300" y2="220"/>
    <line x1="400" y1="10" x2="400" y2="250"/>
    <line x1="500" y1="40" x2="500" y2="220"/>
    <line x1="600" y1="20" x2="600" y2="240"/>
    <line x1="700" y1="40" x2="700" y2="220"/>
    <line x1="60" y1="80" x2="740" y2="80"/>
    <line x1="40" y1="130" x2="760" y2="130"/>
    <line x1="60" y1="180" x2="740" y2="180"/>
  </g>
  <!-- Floating orbs -->
  <circle cx="200" cy="100" r="60" fill="url(#orb1)"/>
  <circle cx="600" cy="140" r="80" fill="url(#orb2)"/>
  <circle cx="400" cy="80" r="40" fill="url(#orb1)"/>
  <!-- Calendar icon -->
  <g transform="translate(340, 70)">
    <rect x="0" y="10" width="120" height="100" rx="12" stroke="#c2a4ff" stroke-width="2" stroke-opacity="0.4" fill="rgba(194,164,255,0.05)"/>
    <line x1="0" y1="40" x2="120" y2="40" stroke="#c2a4ff" stroke-width="1.5" stroke-opacity="0.3"/>
    <line x1="30" y1="0" x2="30" y2="20" stroke="#c2a4ff" stroke-width="2" stroke-opacity="0.5" stroke-linecap="round"/>
    <line x1="90" y1="0" x2="90" y2="20" stroke="#c2a4ff" stroke-width="2" stroke-opacity="0.5" stroke-linecap="round"/>
    <!-- Check mark -->
    <path d="M40 72 L55 87 L82 58" stroke="#c2a4ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.7"/>
  </g>
  <!-- Decorative dots -->
  <circle cx="150" cy="60" r="3" fill="#c2a4ff" fill-opacity="0.3"/>
  <circle cx="650" cy="80" r="2" fill="#c2a4ff" fill-opacity="0.4"/>
  <circle cx="250" cy="200" r="2.5" fill="#c2a4ff" fill-opacity="0.25"/>
  <circle cx="550" cy="210" r="3" fill="#c2a4ff" fill-opacity="0.3"/>
  <circle cx="720" cy="180" r="2" fill="#c2a4ff" fill-opacity="0.2"/>
  <circle cx="80" cy="150" r="2" fill="#c2a4ff" fill-opacity="0.15"/>
  <!-- Connection lines -->
  <path d="M150 60 Q200 100 250 200" stroke="#c2a4ff" stroke-width="0.5" stroke-opacity="0.1" fill="none"/>
  <path d="M550 210 Q600 140 650 80" stroke="#c2a4ff" stroke-width="0.5" stroke-opacity="0.1" fill="none"/>
</svg>
